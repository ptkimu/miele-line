<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500&display=swap">
<style>
  /* LINE リッチメニュー 2500 × 1686（3列×2段のテンプレート用） */
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:2500px;height:1686px;overflow:hidden}
  body{
    background:#FAF7F5;
    font-family:"Zen Kaku Gothic New","Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;
    color:#2B2724;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(2,1fr);
  }
  .cell{
    position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:44px;
    border-right:3px solid #E7DBD4;
    border-bottom:3px solid #E7DBD4;
    padding:40px;
  }
  .cell:nth-child(3n){border-right:0}
  .cell:nth-child(n+4){border-bottom:0}

  /* いちばん押してほしいボタンだけ地色を変える */
  .cell.lead{background:#98543F;border-right-color:#98543F;border-bottom-color:#98543F}
  .cell.lead .label{color:#FFFFFF}
  .cell.lead .sub{color:#EBD6CD}
  .cell.lead svg{stroke:#FFFFFF}

  svg{width:150px;height:150px;fill:none;stroke:#98543F;stroke-width:5;
      stroke-linecap:round;stroke-linejoin:round}

  .label{font-size:74px;font-weight:700;letter-spacing:.02em;line-height:1.2}
  .sub{font-size:40px;font-weight:500;color:#8B7F79;letter-spacing:.04em;line-height:1.2}

  .tag{
    position:absolute;top:52px;right:56px;
    background:#FFFFFF;color:#98543F;
    font-size:32px;font-weight:700;letter-spacing:.08em;
    padding:10px 26px;border-radius:999px;
  }
</style>
</head>
<body>

  <!-- 1 : テキスト「空き枠」 -->
  <div class="cell lead">
    <span class="tag">NEW</span>
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <rect x="14" y="22" width="72" height="64" rx="8"/>
      <path d="M14 40 H86"/><path d="M32 14 V30"/><path d="M68 14 V30"/>
      <path d="M40 62 l8 8 16 -18"/>
    </svg>
    <div class="label">空き枠のお知らせ</div>
    <div class="sub">受け取り設定はこちら</div>
  </div>

  <!-- 2 : テキスト「予約」 -->
  <div class="cell">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <path d="M18 24 h64 a6 6 0 0 1 6 6 v34 a6 6 0 0 1 -6 6 H42 L26 84 V70 H18 a6 6 0 0 1 -6 -6 V30 a6 6 0 0 1 6 -6 z"/>
      <path d="M30 40 H70"/><path d="M30 54 H58"/>
    </svg>
    <div class="label">ご予約・ご相談</div>
    <div class="sub">LINEで承ります</div>
  </div>

  <!-- 3 : テキスト「メニュー」 -->
  <div class="cell">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <rect x="22" y="12" width="56" height="76" rx="7"/>
      <path d="M36 34 H64"/><path d="M36 50 H64"/><path d="M36 66 H54"/>
    </svg>
    <div class="label">メニュー・料金</div>
    <div class="sub">新規価格でご案内</div>
  </div>

  <!-- 4 : リンク（コース診断 LIFF） -->
  <div class="cell">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="45" cy="45" r="27"/>
      <path d="M65 65 L86 86"/>
      <path d="M45 33 v8"/><path d="M45 51 v.5"/>
    </svg>
    <div class="label">コース診断</div>
    <div class="sub">1分でおすすめを提案</div>
  </div>

  <!-- 5 : テキスト「場所」 -->
  <div class="cell">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <path d="M50 88 C50 88 76 62 76 42 A26 26 0 0 0 24 42 C24 62 50 88 50 88 z"/>
      <circle cx="50" cy="42" r="10"/>
    </svg>
    <div class="label">アクセス</div>
    <div class="sub">古河駅 徒歩8分</div>
  </div>

  <!-- 6 : テキスト「営業時間」 -->
  <div class="cell">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="34"/>
      <path d="M50 30 V52 L66 60"/>
    </svg>
    <div class="label">営業時間</div>
    <div class="sub">定休日のご案内</div>
  </div>

</body>
</html>
