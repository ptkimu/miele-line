<!doctype html><meta charset="utf-8"><body>
<!-- out/auto.html をそのまま開いて、自動で出るところまで通しで確かめる。
     run-tests.sh は不要。 -->
<iframe id="host" src="../out/auto.html" style="width:1200px;height:1400px"></iframe>
<script>
const log = [];
const ok = (c, m) => log.push((c ? 'PASS  ' : 'FAIL  ') + m);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

(async () => {
  const host = document.getElementById('host');
  await new Promise((r) => { host.onload = r; });
  await wait(400);
  const D = host.contentDocument;

  ok(D.querySelectorAll('#cal button').length === 20, 'カレンダーが2日ぶん出る（10時間×2）');
  ok(D.querySelectorAll('#cal button.busy').length > 0, '予定が入っている時間がある');
  ok(D.querySelectorAll('#steps li').length === 5, '進み具合が5段で出る');
  ok(D.getElementById('later').disabled, '30分後のボタンは、まだ押せない');
  ok(D.getElementById('line').textContent.includes('まだ送っていません'), '最初は何も送っていない');

  /* 予定の出し入れができる */
  const first = D.querySelector('#cal button');
  const wasBusy = first.classList.contains('busy');
  first.click(); await wait(60);
  ok(D.querySelector('#cal button').classList.contains('busy') !== wasBusy,
     'カレンダーの予定を出し入れできる');
  D.querySelector('#cal button').click(); await wait(60);

  /* 朝10時 */
  D.getElementById('run').click();
  for (let i = 0; i < 60 && D.getElementById('later').disabled; i++) await wait(100);

  ok(!D.getElementById('later').disabled, '朝10時に動いて、次へ進める');
  const line = D.getElementById('line').textContent;
  ok(line.includes('空き'), 'LINEの文面ができている');
  ok(/\d{1,2}:\d{2}/.test(line), '時刻が入っている');
  ok(!line.includes('キャンセル'), '「キャンセル」の語は使っていない');

  const steps = D.getElementById('steps').textContent;
  ok(steps.includes('名のLINEに送った'), '送った人数が出る');
  ok(steps.includes('出す枠を決めた'), '枠を決めたことが分かる');
  ok(D.querySelectorAll('#steps .done').length === 3, '10時の3段が済みになる');

  /* ストーリー画像が描かれている */
  const cv = D.getElementById('story');
  const px = cv.getContext('2d').getImageData(540, 60, 1, 1).data;
  ok(px[3] === 255, 'ストーリーズの画像が描かれている');
  ok(D.getElementById('storyNote').textContent.includes('30分後'),
     'まだ出していないことが分かる');

  /* 30分後 */
  D.getElementById('later').click();
  for (let i = 0; i < 60 && !D.getElementById('gbp').textContent.includes('最新情報'); i++) {
    await wait(100);
  }
  ok(D.getElementById('gbp').textContent.includes('最新情報'), 'Googleに投稿された様子が出る');
  ok(D.getElementById('gbp').textContent.includes('予約'), '「予約」ボタンが付いている');
  ok(D.getElementById('gbp').textContent.includes('ミエーレ'), '店名が入っている');
  ok(D.querySelectorAll('#steps .done').length === 5, '5段すべてが済みになる');
  ok(D.getElementById('storyNote').textContent.includes('出しました'), 'Instagramも出た');

  /* 歯止め */
  D.getElementById('reset').click();
  await new Promise((r) => { host.onload = r; });
  await wait(400);
  const D2 = host.contentDocument;

  D2.querySelector('[data-g="week"]').click();
  D2.getElementById('run').click();
  for (let i = 0; i < 40 && !D2.querySelector('#steps .stop'); i++) await wait(100);
  ok(!!D2.querySelector('#steps .stop'), '週3回を超えていると止まる');
  ok(D2.querySelector('#steps .stop').textContent.includes('3回'), '止まった理由が出る');
  ok(D2.getElementById('later').disabled, '止まったら次へは進めない');

  D2.querySelector('[data-g="week"]').click();
  D2.querySelector('[data-g="nobody"]').click();
  D2.getElementById('run').click();
  await wait(600);
  ok(D2.getElementById('steps').textContent.includes('お送りする方がいませんでした'),
     '希望者がいなければ送らない');

  D2.querySelector('[data-g="nobody"]').click();
  D2.querySelector('[data-g="notSendDay"]').click();
  D2.getElementById('run').click();
  await wait(600);
  ok(D2.getElementById('steps').textContent.includes('送信日ではありません'),
     '送信日でなければ動かない');

  const pre = document.createElement('pre'); pre.id = 'TESTOUT';
  pre.textContent = log.join('\n') + '\n----\n' +
    log.filter((l) => l.startsWith('FAIL')).length + ' 件の失敗 / ' + log.length + ' 件中';
  document.body.appendChild(pre);
})().catch((e) => {
  const pre = document.createElement('pre'); pre.id = 'TESTOUT';
  pre.textContent = log.join('\n') + '\nERROR ' + (e && e.stack ? e.stack : e);
  document.body.appendChild(pre);
});
</script>
